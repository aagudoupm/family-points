<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E86FF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Family Points</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Points">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral de pestañas en horizontal, barra inferior en vertical/estrecho. */
/* Tema «La vuelta al mundo», estilo de videojuego: fondo de rayos azul, superficies blancas con contorno grueso
   y sombra sólida, botones de gominola que se hunden y títulos con borde. De noche, el mismo estilo en azul oscuro. */
:root {
  --bg: #1E86FF; --surface: #FFFFFF; --surface-2: #EEF2FB; --fg: #1D1240; --muted: #5A5E82; --line: #DADFEE;
  --star: #FFC21A; --star-ink: #6B4500; --good: #2CC14A; --good-bg: #DDF7E3; --good-edge: #1E8F35; --bad: #FF4F5E; --bad-bg: #FFE1E4; --bad-edge: #C22A3A;
  --ink: #2E8BFF; --ink-fg: #FFFFFF; --ink-edge: #1458C0; --edge: #1D1240;
  --k: #1D1240; --ray-a: #1E86FF; --ray-b: #3A98FF; --on-bg: #FFFFFF; --on-bg-2: #E6F1FF;
  --pink: #FF4FA3; --purple: #8B45FF; --yellow: #FFD43B;
  --shadow: 0 6px 0 var(--k);
  --tab-on: #FFD43B; --tab-on-fg: #1D1240;
  --font-display: "Lilita One", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Fredoka", ui-rounded, system-ui, -apple-system, sans-serif;
  --radius: 24px;
  --tap: 3.5rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121637; --surface: #232A5C; --surface-2: #2E3670; --fg: #F3F4FF; --muted: #B4BAE0; --line: #3B437E;
    --good-bg: #1C4630; --bad-bg: #4A2030; --ink: #4F9BFF; --ink-edge: #07051A; --edge: #07051A;
    --k: #07051A; --ray-a: #131838; --ray-b: #1A2150; --on-bg-2: #C9D2F5;
    --tab-on: #FFD43B; --tab-on-fg: #1D1240;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #121637; --surface: #232A5C; --surface-2: #2E3670; --fg: #F3F4FF; --muted: #B4BAE0; --line: #3B437E;
    --good-bg: #1C4630; --bad-bg: #4A2030; --ink: #4F9BFF; --ink-edge: #07051A; --edge: #07051A;
    --k: #07051A; --ray-a: #131838; --ray-b: #1A2150; --on-bg-2: #C9D2F5;
    --tab-on: #FFD43B; --tab-on-fg: #1D1240;
    color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
/* Dynamic Type: en iPad el tamaño base sigue el ajuste de texto del sistema */
html { font: -apple-system-body; font-family: var(--font-body); }
@supports not (font: -apple-system-body) { html { font-size: 17px; } }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-weight: 500; font-size: 1rem; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 12px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: .35rem .5rem calc(.35rem + env(safe-area-inset-bottom, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: .1rem; flex: 1 1 0; min-width: 0; max-width: 6.5rem; padding: .35rem .15rem;
  border-radius: 16px; color: var(--muted); font-size: .78rem; font-weight: 600; }
.tab span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 440px) { .tab { font-size: .68rem; } .tabs { padding-inline: .25rem; } }
.tab svg { width: 1.9rem; height: 1.9rem; }
.tab[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.main { padding-inline: 16px; padding-block: 1.25rem calc(6.5rem + env(safe-area-inset-bottom, 0px)); min-width: 0; }
@media (min-width: 900px) {
  .app { grid-template-columns: 6.5rem 1fr; }
  .tab { flex: none; max-width: none; }
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; flex-direction: column; justify-content: flex-start;
    gap: .5rem; border-top: 0; border-right: 1px solid var(--line); padding: 1rem .5rem; }
  .tabs .brand { display: grid; }
  .main { padding-inline: 28px; padding-block: 1.5rem 2rem; }
}
.brand { display: none; place-items: center; width: 3.4rem; height: 3.4rem; margin: 0 auto .75rem; border-radius: 18px;
  background: var(--star); color: var(--star-ink); }
.brand svg { width: 2rem; height: 2rem; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.page-head h1 { font-size: 2rem; }
.sub { color: var(--muted); }
.section-title { font-family: var(--font-display); font-size: 1.35rem; margin: 1.75rem 0 .75rem; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: var(--tap); padding: 0 1.25rem;
  border-radius: 999px; font-weight: 700; background: var(--surface-2); color: var(--fg); }
.btn.primary { background: var(--ink); color: var(--ink-fg); }
.btn.good { background: var(--good); color: #fff; }
.btn.bad { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn svg { width: 1.2rem; height: 1.2rem; }
.btn.small { min-height: 2.75rem; padding: 0 1rem; font-size: .92rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: scale(.97); }
.icon-btn { display: inline-grid; place-items: center; width: 2.9rem; height: 2.9rem; border-radius: 999px; background: var(--surface-2); font-size: 1.2rem; }
.icon-btn svg { width: 1.4rem; height: 1.4rem; }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.9rem; padding: 0 1rem 0 .4rem; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--line); font-weight: 600; }
.chip.text { padding: 0 1rem; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 22px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { min-height: 2.6rem; padding: 0 1rem; border-radius: 999px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* ---------- Avatares ---------- */
.avatar { --c: var(--ink); display: inline-grid; place-items: center; flex: none; width: 2.2rem; height: 2.2rem; border-radius: 50%;
  background: var(--c); font-size: 1.25rem; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 6.5rem; height: 6.5rem; font-size: 3.6rem; box-shadow: 0 0 0 5px var(--surface), 0 0 0 8px var(--c); }
.avatar.md { width: 3.4rem; height: 3.4rem; font-size: 1.9rem; }

/* ---------- Panel ---------- */
.dash { display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .dash { grid-template-columns: 1fr 20rem; align-items: start; } }
.members { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
.mcard { --c: var(--ink); position: relative; display: flex; flex-direction: column; align-items: center; gap: .6rem; padding: 1.5rem 1rem 1.25rem;
  border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); text-align: center; overflow: hidden;
  border: 2px solid transparent; transition: transform .15s ease; }
.mcard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4.6rem; background: color-mix(in srgb, var(--c) 22%, var(--surface)); }
.mcard > * { position: relative; }
.mcard:active { transform: scale(.98); }
.mcard .name { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.balance { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1;
  font-variant-numeric: tabular-nums; }
.balance .star { width: 1.9rem; height: 1.9rem; color: var(--star); }
.balance.neg { color: var(--bad); }
.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.18); } }
.mcard .week { font-size: .85rem; color: var(--muted); font-weight: 600; }
@media (max-width: 500px) {
  .members { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .mcard { padding: 1rem .5rem .9rem; gap: .4rem; }
  .mcard::before { height: 3.2rem; }
  .mcard .avatar.lg { width: 4.4rem; height: 4.4rem; font-size: 2.5rem; box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--c); }
  .mcard .name { font-size: 1.2rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mcard .balance { font-size: 2rem; }
  .mcard .balance .star { width: 1.5rem; height: 1.5rem; }
  .mcard .week { font-size: .75rem; }
  .page-head h1 { font-size: 1.7rem; }
}
.ranking { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem; }
.ranking h2 { font-size: 1.35rem; margin-bottom: .2rem; }
.rank-list { list-style: none; margin: .75rem 0 0; padding: 0; display: grid; gap: .5rem; }
.rank-list li { display: grid; grid-template-columns: 2.2rem auto 1fr auto; align-items: center; gap: .6rem; padding: .5rem .6rem; border-radius: 16px; }
.rank-list li.first { background: color-mix(in srgb, var(--star) 18%, var(--surface)); }
.rank-pos { font-family: var(--font-display); font-size: 1.4rem; text-align: center; }
.rank-name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-pts { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }

/* ---------- Hojas (modales) ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; background: rgba(10, 14, 24, .45);
  animation: fade .18s ease; padding-top: calc(2rem + env(safe-area-inset-top, 0px)); }
@media (min-width: 700px) { .overlay { place-items: center; padding: 2rem; } }
.sheet { width: 100%; max-width: 40rem; max-height: 100%; overflow: auto; background: var(--bg); border-radius: 28px 28px 0 0;
  padding: 1.25rem 16px calc(1.5rem + env(safe-area-inset-bottom, 0px)); animation: rise .22s ease; -webkit-overflow-scrolling: touch; }
.sheet.wide { max-width: 64rem; }
@media (min-width: 700px) { .sheet { border-radius: 28px; padding: 1.5rem 1.75rem; } }
.sheet-head { display: flex; align-items: center; gap: .9rem; margin-bottom: 1.1rem; }
.sheet-head h2 { font-size: 1.6rem; flex: 1; min-width: 0; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }

/* Asignar puntos */
.assign-cols { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
@media (min-width: 640px) { .assign-cols { grid-template-columns: 1fr 1fr; } }
.col-title { display: flex; align-items: center; gap: .5rem; font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 .6rem; }
.col-title .dot { width: .9rem; height: .9rem; border-radius: 50%; }
.rule-grid { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); }
.rule { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; min-height: 8rem;
  padding: .75rem .5rem; border-radius: 20px; text-align: center; font-weight: 600; line-height: 1.15; border: 2px solid transparent; }
.rule .ico { font-size: 2.6rem; line-height: 1; }
.rule .pts { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; }
.rule.pos { background: var(--good-bg); }
.rule.pos .pts { color: var(--good); }
.rule.neg { background: var(--bad-bg); }
.rule.neg .pts { color: var(--bad); }
.rule:active { transform: scale(.95); }
.rule.pos:active { border-color: var(--good); }
.rule.neg:active { border-color: var(--bad); }
.float { position: fixed; z-index: 70; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 2.4rem;
  animation: floatUp .9s ease-out forwards; }
@keyframes floatUp { to { transform: translateY(-80px); opacity: 0; } }
.custom-box { margin-top: 1.25rem; padding: 1rem; background: var(--surface); border-radius: 20px; display: grid; gap: .8rem; }
.stepper { display: flex; align-items: center; gap: .75rem; }
.stepper .val { min-width: 4.5rem; text-align: center; font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; }
.stepper button { width: var(--tap); height: var(--tap); border-radius: 50%; font-size: 1.8rem; font-weight: 700; }

/* ---------- Formularios ---------- */
.field { display: grid; gap: .35rem; }
.field > span { font-weight: 700; font-size: .9rem; color: var(--muted); }
.input { width: 100%; min-height: 3.2rem; padding: .6rem .9rem; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }
.input:focus { outline: none; border-color: var(--ink); }
.form { display: grid; gap: 1rem; }
.form-actions { display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .5rem; }
.form-actions .spacer { flex: 1; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(3rem, 1fr)); gap: .35rem; max-height: 11rem; overflow: auto; padding: 2px; }
.emoji-grid button { height: 3rem; border-radius: 12px; font-size: 1.6rem; background: var(--surface); border: 2px solid transparent; }
.emoji-grid button[aria-pressed="true"] { border-color: var(--ink); }
.swatches { display: flex; gap: .5rem; flex-wrap: wrap; }
.swatch { width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--fg); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.2rem; }
.toggle { position: relative; width: 3.6rem; height: 2.1rem; border-radius: 999px; background: var(--line); flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.toggle[aria-checked="true"] { background: var(--good); }
.toggle[aria-checked="true"]::after { transform: translateX(1.5rem); }

/* ---------- Listas ---------- */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: .8rem; padding: .7rem 1rem; min-height: 4rem; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--muted); font-size: .85rem; }
.row .ico { font-size: 1.8rem; width: 2.4rem; text-align: center; flex: none; }
.row button.grow { text-align: left; display: flex; align-items: center; gap: .8rem; }
.pill { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; padding: .15rem .7rem; border-radius: 999px; white-space: nowrap; }
.pill.pos { background: var(--good-bg); color: var(--good); }
.pill.neg { background: var(--bad-bg); color: var(--bad); }
.pill.neu { background: var(--surface-2); color: var(--muted); }
.day-head { font-family: var(--font-display); font-size: 1.1rem; margin: 1.25rem 0 .5rem; color: var(--muted); }
.filters { display: grid; gap: .75rem; margin-bottom: .5rem; }
.date-range { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.date-range .input { width: auto; min-height: 2.9rem; }
.empty { display: grid; justify-items: center; gap: .6rem; text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
.empty .big { font-size: 3.5rem; }

/* ---------- Recompensas ---------- */
.rewards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }
.reward { display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: 1.25rem .75rem 1rem; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow); text-align: center; border: 2px solid transparent; }
.reward .ico { font-size: 3.4rem; line-height: 1.1; }
.reward .t { font-weight: 700; line-height: 1.2; }
.cost { display: inline-flex; align-items: center; gap: .25rem; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; }
.cost .star { width: 1.3rem; height: 1.3rem; color: var(--star); }
.reward.locked { opacity: .55; }
.reward .need { font-size: .85rem; color: var(--muted); font-weight: 600; }
.reward:not(.locked) { border-color: var(--star); }
.reward:not(.locked) .need { background: var(--star); color: #2A1E00; padding: .3rem 1rem; border-radius: 999px; font-weight: 800; font-size: .95rem; }
.progress { width: 100%; height: .55rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--star); border-radius: 999px; }
.who { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem; margin-bottom: 1.25rem; }

/* ---------- Estadísticas ---------- */
.stats-grid { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .stats-grid { grid-template-columns: 3fr 2fr; } }
.chart-card { padding: 1.25rem; min-width: 0; }
.chart-card h2 { font-size: 1.3rem; }
.chart-wrap { position: relative; margin-top: .75rem; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
.chart-wrap .zero { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  border-radius: 12px; padding: .5rem .7rem; box-shadow: var(--shadow); font-size: .85rem; min-width: 8rem; }
.tip b { display: block; margin-bottom: .2rem; font-family: var(--font-display); }
.tip .r { display: flex; align-items: center; gap: .4rem; justify-content: space-between; }
.tip .k { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; }
.legend { display: flex; gap: .4rem 1rem; flex-wrap: wrap; margin-top: .6rem; font-size: .9rem; color: var(--fg); }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; }
.bars { display: grid; gap: .55rem; margin-top: .8rem; }
.bar-row { display: grid; grid-template-columns: 2rem minmax(0, 9rem) 1fr 2.5rem; align-items: center; gap: .5rem; }
.bar-row .lab { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 1.1rem; }
.bar-row .fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 4px; }
.bar-row .fill.pos { background: var(--good); }
.bar-row .fill.neg { background: var(--bad); }
.bar-row .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; margin-top: .8rem; }
table.data { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: .4rem .6rem; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; }
.tiles { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); margin-bottom: 1.25rem; }
.tile { padding: 1rem; display: flex; align-items: center; gap: .7rem; }
.tile .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: .8rem; color: var(--muted); font-weight: 600; }

/* ---------- Ajustes ---------- */
.settings { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
.settings > div { min-width: 0; }
@media (min-width: 1000px) { .settings { grid-template-columns: 1fr 1fr; align-items: start; } }
.set-card { padding: 1.1rem 1.1rem .6rem; }
.set-card h2 { font-size: 1.3rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .4rem; }
.set-card .row { padding-inline: 0; }
.order-btns { display: flex; gap: .25rem; }
.order-btns .icon-btn { width: 2.6rem; height: 2.6rem; }
.note { font-size: .85rem; color: var(--muted); margin: .25rem 0 .75rem; }
.banner { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; padding: .9rem 1rem; border-radius: 18px;
  background: color-mix(in srgb, var(--star) 20%, var(--surface)); margin-bottom: 1.25rem; }
.banner p { margin: 0; flex: 1; min-width: 12rem; }

/* ---------- Barra: Ajustes solo en la barra lateral ---------- */
.tab.rail-only { display: none; }
@media (min-width: 900px) { .tab.rail-only { display: flex; margin-top: auto; } }
.view-switch { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
.banners { display: grid; gap: .75rem; margin-bottom: 1.25rem; }
.banners:empty { display: none; }
.banners .banner { margin: 0; }

/* ---------- Retos ---------- */
.chal-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 21rem), 1fr)); align-items: start; }
.chal { padding: .9rem 1rem .5rem; min-width: 0; }
.chal-head { display: flex; align-items: center; gap: .75rem; width: 100%; text-align: left; padding-bottom: .5rem; }
.chal-ico { font-size: 2.3rem; line-height: 1; flex: none; }
.chal-title { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.chal-meta { display: block; color: var(--muted); font-size: .82rem; }
.chal-name { display: block; font-weight: 700; font-size: .92rem; }
.chal-row { display: flex; align-items: center; gap: .7rem; padding: .6rem 0; border-top: 1px solid var(--line); }
.chal-row .grow { flex: 1; min-width: 0; display: grid; gap: .25rem; }
.chal-who { display: inline-flex; flex: none; }
.chal-who .avatar + .avatar { margin-left: -.7rem; box-shadow: 0 0 0 2px var(--surface); }
.bar { display: block; height: .75rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; transition: width .5s ease; }
.bar.failed > i { background: var(--bad) !important; }
.st { flex: none; font-size: .78rem; font-weight: 800; padding: .3rem .7rem; border-radius: 999px; white-space: nowrap; }
.st.active, .st.dismissed { background: var(--surface-2); color: var(--muted); }
.st.ready { background: var(--star); color: #2A1E00; }
.st.confirmed { background: var(--good-bg); color: var(--good); }
.st.failed { background: var(--bad-bg); color: var(--bad); }
.pending-list { display: grid; gap: .75rem; }
.pending { display: flex; align-items: center; gap: .75rem; padding: .8rem 1rem; flex-wrap: wrap; }
.pending .grow { flex: 1; min-width: 10rem; }
.celebrate { display: grid; justify-items: center; gap: .5rem; text-align: center; padding-bottom: .5rem; }
.big-badge { width: 7.5rem; height: 7.5rem; border-radius: 50%; display: grid; place-items: center; font-size: 4rem;
  background: color-mix(in srgb, var(--star) 28%, var(--surface)); box-shadow: 0 0 0 6px var(--star), 0 0 0 12px color-mix(in srgb, var(--star) 30%, transparent);
  animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); margin: .75rem 0; }
@keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } }
.celebrate .ct { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; margin: 0; }
.celebrate .cs { font-size: 1.1rem; margin: 0; font-weight: 600; }
.celebrate .cb { margin: 0; color: var(--muted); font-weight: 600; }
.celebrate .btn { margin-top: .75rem; min-width: 12rem; }

/* Insignias */
.badges { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); }
.badge { display: grid; justify-items: center; gap: .35rem; padding: .9rem .5rem; border-radius: 18px; background: var(--surface-2); text-align: center; font-weight: 700; font-size: .85rem; line-height: 1.2; }
.badge .medal { width: 4rem; height: 4rem; display: grid; place-items: center; font-size: 2.2rem; border-radius: 50%;
  background: color-mix(in srgb, var(--star) 25%, var(--surface)); box-shadow: 0 0 0 3px var(--star); }

/* Más */
.more-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); }
.more-tile { display: grid; justify-items: center; gap: .5rem; padding: 1.4rem .75rem; font-weight: 700; text-align: center; border-radius: var(--radius); }
.more-tile .ico { font-size: 2.5rem; line-height: 1; }
.more-tile:active { transform: scale(.97); }

/* ---------- PIN ---------- */
.pin-dots { display: flex; justify-content: center; gap: 1rem; margin: .5rem 0 1.25rem; }
.pin-dots i { width: 1.2rem; height: 1.2rem; border-radius: 50%; border: 2px solid var(--fg); }
.pin-dots i.on { background: var(--fg); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 5rem); gap: .8rem; justify-content: center; }
.pin-pad button { width: 5rem; height: 5rem; border-radius: 50%; background: var(--surface); font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; box-shadow: var(--shadow); }
.pin-pad button.blank { visibility: hidden; }
.pin-msg { text-align: center; min-height: 1.5rem; color: var(--bad); font-weight: 600; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

/* ---------- Bienvenida ---------- */
.welcome { max-width: 40rem; margin: 3rem auto; text-align: center; display: grid; gap: 1.25rem; justify-items: center; }
.welcome h1 { font-size: 2.6rem; }
.welcome .stars { display: flex; gap: .4rem; color: var(--star); }
.welcome .stars svg { width: 3rem; height: 3rem; }
.welcome .actions { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; }

/* ---------- Toast y confeti ---------- */
.toast { position: fixed; left: 0; right: 0; margin-inline: auto; width: fit-content; bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); z-index: 80;
  display: flex; align-items: center; gap: .8rem; max-width: calc(100% - 32px); padding: .55rem .6rem .55rem 1.1rem;
  background: var(--fg); color: var(--bg); border-radius: 999px; box-shadow: var(--shadow); font-weight: 600; animation: rise .2s ease; }
@media (min-width: 900px) { .toast { bottom: 2rem; } }
.toast button { min-height: 2.6rem; padding: 0 1rem; border-radius: 999px; background: var(--star); color: #2A1E00; font-weight: 800; }
#confetti { position: fixed; inset: 0; z-index: 90; pointer-events: none; width: 100%; height: 100%; }
.status-line { font-size: .8rem; color: var(--muted); text-align: center; margin-top: 2rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* =====================================================================
   Tema «La vuelta al mundo» (sobrescribe los estilos base)
   ===================================================================== */
body { background: var(--bg); font-weight: 700; }
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--ray-a); }
.scene::before { content: ""; position: absolute; left: 50%; top: 18%; width: 260vmax; height: 260vmax; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(var(--ray-a) 0 10deg, var(--ray-b) 10deg 20deg); }
.scene::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .16), transparent 55%); }
.app { position: relative; z-index: 1; }
.main { color: var(--on-bg); }
h1, h2, h3, .num, .balance, .cost, .rank-pts, .rank-pos, .tile .v, .stepper .val, .rule .pts, .celebrate .ct, .pin-pad button { font-weight: 400; }
h1 { color: #fff; -webkit-text-stroke: 7px var(--k); paint-order: stroke fill; text-shadow: 0 5px 0 var(--k); letter-spacing: .01em; }
.page-head h1, .panel-head h1 { font-size: 2.4rem; }
.main .sub, .main .day-head, .main .section-title, .main > div > .col-title { color: var(--on-bg-2); }
.main .day-head, .main .section-title { color: #fff; -webkit-text-stroke: 4px var(--k); paint-order: stroke fill; }
.emo { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: -0.28em; display: inline-block; flex: none; filter: drop-shadow(0 2px 0 rgba(29, 18, 64, .25)); }
.ico .emo, .big .emo, .medal .emo, .big-badge .emo, .chal-ico .emo, .avatar > .emo { width: 1em; height: 1em; vertical-align: middle; }
.empty { color: var(--on-bg); }
.card .empty, .sheet .empty { color: var(--muted); }

/* Superficies: blancas con contorno grueso y sombra sólida */
:is(.card, .ranking, .mcard, .reward, .chal, .set-card, .more-tile, .tile, .banner, .pending, .who, .custom-box) {
  background: var(--surface); color: var(--fg); border: 4px solid var(--k); border-radius: var(--radius); box-shadow: var(--shadow); }
:is(.card, .ranking, .mcard, .reward, .chal, .set-card, .more-tile, .tile, .banner, .pending, .who, .custom-box) .sub { color: var(--muted); }
.list.card { overflow: hidden; }
.banner { background: color-mix(in srgb, var(--yellow) 30%, var(--surface)); }
.sheet { background: var(--surface-2); color: var(--fg); border: 4px solid var(--k); border-bottom: 0; border-radius: 30px 30px 0 0; box-shadow: 0 -6px 0 rgba(0, 0, 0, .15); }
@media (min-width: 700px) { .sheet { border-bottom: 4px solid var(--k); border-radius: 30px; box-shadow: 0 8px 0 var(--k); } }
.sheet h1 { font-size: 1.8rem; }
.sheet-head h2 { font-size: 1.8rem; color: #fff; -webkit-text-stroke: 6px var(--k); paint-order: stroke fill; text-shadow: 0 4px 0 var(--k); }
.overlay { background: rgba(10, 8, 40, .55); }

/* Botones de gominola */
.btn { --b: var(--surface); --e: var(--k); background: linear-gradient(180deg, color-mix(in srgb, var(--b) 78%, #fff) 0%, var(--b) 60%);
  color: var(--fg); border: 4px solid var(--k); border-radius: 18px; box-shadow: 0 5px 0 var(--k); font-weight: 900; transition: transform .07s, box-shadow .07s; }
.btn.primary { --b: var(--ink); color: #fff; text-shadow: 0 2px 0 var(--k); }
.btn.good { --b: var(--good); color: #fff; text-shadow: 0 2px 0 var(--k); }
.btn.bad { --b: var(--bad); color: #fff; text-shadow: 0 2px 0 var(--k); }
.btn.ghost { background: transparent; border: 3px solid currentColor; box-shadow: none; color: inherit; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--k); }
.btn.small { border-radius: 14px; border-width: 3px; box-shadow: 0 4px 0 var(--k); }
.icon-btn { background: var(--surface); color: var(--fg); border: 4px solid var(--k); box-shadow: 0 4px 0 var(--k); width: 3.2rem; height: 3.2rem; font-size: 1.5rem; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--k); }
.chip { background: var(--surface); color: var(--fg); border: 3px solid var(--k); box-shadow: 0 3px 0 var(--k); font-weight: 800; }
.chip[aria-pressed="true"] { background: var(--yellow); color: #1D1240; border-color: var(--k); }
.seg { background: var(--surface); border: 3px solid var(--k); border-radius: 999px; box-shadow: 0 3px 0 var(--k); }
.seg button { color: var(--muted); font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--yellow); color: #1D1240; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12); }
.input { border: 3px solid var(--k); border-radius: 14px; background: var(--surface); color: var(--fg); }
.input:focus { border-color: var(--ink); }
.field > span { color: var(--muted); }
.toggle { border: 3px solid var(--k); }
.toggle::after { top: .1rem; left: .1rem; }
.swatch { border: 3px solid var(--k); box-shadow: 0 3px 0 var(--k); }
.swatch[aria-pressed="true"] { outline: 4px solid var(--yellow); outline-offset: 2px; box-shadow: 0 3px 0 var(--k); }
.emoji-grid button { border: 2px solid var(--line); }
.emoji-grid button[aria-pressed="true"] { border-color: var(--k); background: var(--yellow); }

/* Barra de pestañas */
.tabs { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: .4rem; border: 4px solid var(--k); border-radius: 26px;
  background: var(--surface); box-shadow: 0 6px 0 var(--k); }
.tab { color: var(--muted); font-weight: 900; border-radius: 18px; border: 3px solid transparent; }
.tab .tab-ico { font-size: 1.9rem; line-height: 1; display: inline-flex; transition: transform .2s; }
.tab[aria-current="page"] { background: var(--tab-on); color: var(--tab-on-fg); border-color: var(--k); box-shadow: 0 3px 0 var(--k); }
.tab[aria-current="page"] .tab-ico { transform: translateY(-2px) scale(1.08); }
.tab:active { transform: translateY(3px); }
.main { padding-block: 1.25rem calc(7.5rem + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  .tabs { left: auto; right: auto; bottom: auto; margin: 12px 0 12px 12px; height: calc(100dvh - 24px); border-radius: 28px; }
  .main { padding-block: 1.5rem 2rem; }
}
.brand { background: transparent; font-size: 2.6rem; width: auto; height: auto; }
.toast { bottom: calc(7.4rem + env(safe-area-inset-bottom, 0px)); background: var(--k); color: #fff; border: 3px solid #fff; }
@media (min-width: 900px) { .toast { bottom: 2rem; } }
.toast button { border: 3px solid #fff; }

/* Avatares: la cara del viajero en un círculo de su color */
.avatar { background: color-mix(in srgb, var(--c) 55%, #fff); border: 3px solid var(--k); }
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar.lg { box-shadow: 0 4px 0 var(--k); }
.chal-who .avatar + .avatar { box-shadow: none; }
.kid { display: inline-block; flex: none; aspect-ratio: 3 / 4; width: 6rem; position: relative; }
.kid svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* Panel */
.panel-head { display: grid; gap: .7rem; margin-bottom: 1.25rem; }
.top-actions { display: flex; gap: .6rem; justify-content: flex-end; }
.members { grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); }
.mcard { --c: var(--ink); display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; align-items: stretch; text-align: left; padding: .9rem 1rem 1rem; overflow: hidden; min-width: 0; width: 100%; }
.mcard > * { min-width: 0; }
.mcard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5.2rem; background: color-mix(in srgb, var(--c) 30%, var(--surface)); border-bottom: 3px solid color-mix(in srgb, var(--c) 45%, var(--surface)); }
.mcard:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--k); }
.mc-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "kid name bal" "kid where where"; align-items: center; column-gap: .6rem; row-gap: .35rem; }
.mc-top .kid { grid-area: kid; }
.mc-top .name { grid-area: name; }
.mc-top .balance { grid-area: bal; }
.mc-top .where { grid-area: where; justify-self: start; }
.mcard .name { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.mcard .balance { font-size: 2rem; }
.where { display: inline-flex; align-items: center; gap: .3rem; max-width: 100%; font-weight: 900; font-size: .85rem; line-height: 1.1;
  padding: .2rem .6rem .2rem .25rem; border-radius: 999px; border: 3px solid var(--k); background: var(--yellow); color: #1D1240; }
.where .emo { width: 1.4rem; height: 1.4rem; }
.where > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.balance { display: inline-flex; align-items: center; gap: .2rem; font-family: var(--font-display); font-size: 2.4rem; line-height: 1; }
.balance .n { color: var(--star); -webkit-text-stroke: 6px var(--k); paint-order: stroke fill; text-shadow: 0 4px 0 var(--k); }
.balance.neg .n { color: var(--bad); }
.balance .emo.star { width: .85em; height: .85em; vertical-align: -0.05em; }
.flight { display: flex; align-items: center; gap: .5rem; margin-top: .2rem; }
.fl-flag { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 3px solid var(--k); box-shadow: 0 3px 0 var(--k); }
.fl-flag .emo { width: 1.7rem; height: 1.7rem; }
.fl-flag.next .emo { filter: grayscale(.4); }
.fl-route { position: relative; flex: 1; height: 16px; border-radius: 99px; border: 3px solid var(--k); background: var(--surface-2); }
.fl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, #FFB800 10px 20px); transition: width .6s ease; }
.fl-plane { position: absolute; top: 50%; transform: translate(-50%, -58%); transition: left .6s ease; }
.fl-plane .emo { width: 2.4rem; height: 2.4rem; filter: drop-shadow(0 3px 0 var(--k)); }
.goal { font-size: .9rem; font-weight: 900; }
.mc-foot { display: flex; gap: .4rem .9rem; flex-wrap: wrap; }
.mcard .week { font-size: .8rem; color: var(--muted); font-weight: 800; }
@media (max-width: 500px) {
  .members { grid-template-columns: minmax(0, 1fr); }
  .card-kid { width: 4rem; }
  .mcard .name { font-size: 1.35rem; }
  .mcard .balance { font-size: 2rem; }
}
.ranking { padding: 1.1rem; }
.ranking h2 { font-size: 1.5rem; }
.rank-list li.first { background: color-mix(in srgb, var(--yellow) 45%, var(--surface)); border: 3px solid var(--k); }
.rank-pos .emo { width: 1.6rem; height: 1.6rem; }
.rank-pts { font-family: var(--font-display); }

/* Dar estrellas: fichas con contorno */
.rule { border: 3px solid var(--k); box-shadow: 0 5px 0 var(--k); border-radius: 20px; transition: transform .07s, box-shadow .07s; color: var(--fg); }
.rule:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--k); }
.rule .ico { font-size: 2.8rem; }
.rule .pts { font-family: var(--font-display); }
.rule.pos .pts { color: var(--good-edge); }
.rule.neg .pts { color: var(--bad-edge); }
.fly { position: fixed; z-index: 90; width: 2.8rem; height: 2.8rem; pointer-events: none; transition: transform .7s cubic-bezier(.5, -0.35, .7, 1), opacity .2s .55s; }
.bounce { animation: bounce .55s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bounce { 35% { transform: translateY(-12px) scale(1.06); } }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px) rotate(-5deg); } 40%, 80% { transform: translateX(6px) rotate(5deg); } }
.custom-box { padding: 1rem; }

/* Premios, retos e insignias */
.reward .ico { font-size: 3.6rem; }
.reward .cost { font-family: var(--font-display); }
.reward:not(.locked) { background: color-mix(in srgb, var(--yellow) 22%, var(--surface)); }
.reward:not(.locked) .need { background: var(--yellow); color: #1D1240; border: 3px solid var(--k); box-shadow: 0 3px 0 var(--k); }
.reward:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--k); }
.chal-ico { font-size: 2.6rem; }
.chal-title { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; }
.chal-row { border-top: 2px dashed var(--line); }
.steps { display: flex; gap: .3rem; flex-wrap: wrap; }
.step { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.15rem; background: var(--surface-2); border: 2px solid var(--line); }
.step.on { background: var(--yellow); border-color: var(--k); }
.steps.failed .step { background: var(--bad-bg); }
.bar, .progress { height: 1rem; background: var(--surface-2); border: 3px solid var(--k); }
.bar > i, .progress > i { background: repeating-linear-gradient(-45deg, var(--good) 0 10px, #25AE41 10px 20px); }
.st, .pill { border: 2px solid var(--k); }
.badge { background: var(--surface); border: 3px solid var(--k); box-shadow: 0 4px 0 var(--k); color: var(--fg); }
.badge .medal, .big-badge { background: radial-gradient(circle at 35% 28%, #FFF6C4 0%, #FFD24D 45%, #F0A800 100%); border: 4px solid var(--k); box-shadow: 0 4px 0 var(--k); }
.big-badge .emo { width: 4.4rem; height: 4.4rem; }
.celebrate .ct { font-family: var(--font-display); }
.more-tile { color: var(--fg); }
.more-tile .ico { font-size: 2.8rem; }
.more-tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--k); }
.pin-pad button { background: var(--surface); border: 4px solid var(--k); box-shadow: 0 4px 0 var(--k); color: var(--fg); }
.pin-dots i { border-color: var(--k); }
.pin-dots i.on { background: var(--k); }
.welcome .stars { font-size: 3.2rem; gap: .8rem; }
.welcome .sub, .welcome p { color: var(--on-bg); }
.empty .big { font-size: 4rem; }
.tile > span:first-child { font-size: 2rem !important; }
.tile .l { color: var(--muted); }

/* Perfil ambientado en el país */
.pf-hero { --c: var(--ink); position: relative; overflow: hidden; display: grid; gap: .5rem 1rem; grid-template-columns: auto minmax(0, 1fr); align-items: center;
  padding: 1rem 1.1rem; margin-bottom: 1.25rem; border-radius: 26px; background: var(--surface); border: 4px solid var(--k); box-shadow: var(--shadow); }
.pf-stripes { position: absolute; inset: 0; background: var(--stripes); opacity: .25; }
.pf-landmark { position: absolute; right: -.4rem; bottom: -.8rem; opacity: .95; }
.pf-landmark .emo, .pf-landmark img { width: 8.5rem; height: 8.5rem; object-fit: contain; filter: drop-shadow(0 5px 0 rgba(29, 18, 64, .25)); }
.pf-hero > :not(.pf-stripes):not(.pf-landmark):not(.pf-scene) { position: relative; }
.pf-id { display: grid; justify-items: center; gap: .3rem; }
.pf-bal .balance { font-size: 2.2rem; }
.pf-level { display: grid; gap: .4rem; min-width: 0; justify-items: start; padding-right: 5rem; }
.pf-where { font-family: var(--font-display); font-size: 2rem; line-height: 1; color: #fff; -webkit-text-stroke: 6px var(--k); paint-order: stroke fill; text-shadow: 0 4px 0 var(--k); }
.pf-bar { width: 100%; height: 1.1rem; }
.pf-bar > i { background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, #FFB800 10px 20px); }
.pf-next { margin: 0; font-weight: 900; }
.pf-sub { display: block; font-size: .82rem; color: var(--muted); font-weight: 800; }
.pf-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .6rem; }
.pf-actions .btn { min-height: 3rem; padding: 0 1rem; }
.pf-trip { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); margin-bottom: 1.4rem; }
@media (min-width: 800px) { .pf-trip { grid-template-columns: 1fr 1fr; } }
.pf-box { padding: 1rem; display: grid; gap: .5rem; align-content: start; }
.pf-sec { margin-bottom: 1.4rem; }
.pf-h { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; display: flex; align-items: center; gap: .4rem; }
.pf-sec > .pf-h { margin-bottom: .7rem; }
.pf-h small { font-family: var(--font-body); font-size: .85rem; font-weight: 900; color: var(--muted); margin-left: .3rem; }
.hello-word { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; color: var(--pink); -webkit-text-stroke: 5px var(--k); paint-order: stroke fill; }
.ficha { display: grid; gap: .45rem; }
.frow { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); align-items: center; gap: .6rem; padding: .35rem .7rem; border: 3px solid var(--k); border-radius: 16px; background: var(--surface-2); }
.frow .f-ico .emo { width: 2.2rem; height: 2.2rem; }
.frow small { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 900; }
.frow b { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; line-height: 1.15; }
.fact { margin: 0; font-size: 1.05rem; }
.stamps { list-style: none; margin: .3rem 0 0; padding: 0; display: flex; gap: .7rem .55rem; flex-wrap: wrap; }
.stamp { width: 4.3rem; height: 4.3rem; border-radius: 50%; border: 3px dashed var(--k); display: grid; place-items: center; transform: rotate(-8deg); background: #FFF7D6; position: relative; }
.stamp .emo { width: 2.3rem; height: 2.3rem; }
.stamp small { position: absolute; bottom: -.45rem; font-size: .6rem; font-weight: 900; background: var(--k); color: #fff; padding: 0 .35rem; border-radius: 6px; max-width: 5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stamp.here { border-style: solid; border-color: var(--pink); background: #FFE3F1; transform: rotate(6deg); box-shadow: 0 0 0 3px var(--k); }
.stamp.lock { opacity: .4; transform: none; background: var(--surface-2); }
.stamp.lock .emo { filter: grayscale(1); }
.pf-give { scroll-margin-top: 1rem; padding-top: .6rem; border-top: 4px dashed var(--line); }
.pf-give h4.col-title { font-size: 1.1rem; }
.pf-streak { display: flex; align-items: center; gap: .9rem; padding: .9rem 1.1rem; }
.pf-streak strong { display: block; font-size: 1.05rem; }
.pf-fire { font-size: 2.8rem; line-height: 1; }
.pf-fire.off .emo { filter: grayscale(1) opacity(.5); }
.pf-streak-n { font-family: var(--font-display); font-size: 2.6rem; color: #FF7A1A; -webkit-text-stroke: 6px var(--k); paint-order: stroke fill; }

/* Billete de avión al llegar a un país */
.pillc { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--font-display); font-size: 1.15rem; background: var(--surface); color: var(--fg);
  border: 3px solid var(--k); border-radius: 999px; padding: .1rem .7rem .1rem .3rem; box-shadow: 0 3px 0 var(--k); }
.pillc .emo { width: 1.5rem; height: 1.5rem; }
.ticket { border: 4px solid var(--k); border-radius: 22px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); gap: 0; padding: 0; animation: pop .55s cubic-bezier(.2, 1.6, .4, 1); }
.tk-top { width: 100%; display: flex; align-items: center; justify-content: center; gap: .5rem; padding: .7rem 1rem; background: var(--ink); color: #fff; border-bottom: 4px dashed var(--k); }
.tk-top strong { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; -webkit-text-stroke: 5px var(--k); paint-order: stroke fill; }
.tk-top .emo { width: 2rem; height: 2rem; }
.tk-body { display: grid; justify-items: center; gap: .7rem; padding: 1rem; width: 100%; }
.tk-legs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .5rem; width: 100%; }
.tk-legs > span { display: grid; justify-items: center; gap: .2rem; }
.tk-legs .emo { width: 3rem; height: 3rem; }
.tk-legs b { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; }
.tk-plane .emo { width: 3.2rem; height: 3.2rem; animation: flyp 1.6s ease-in-out infinite; }
@keyframes flyp { 50% { transform: translate(8px, -6px) rotate(8deg); } }
.tk-info { margin: 0; font-weight: 800; }
.tk-gains { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }

/* Personajes con el marco de su rango (bronce, plata, oro, esmeralda y amatista) */
.portrait { --rank: #CD7F32; --rank-l: #F3C08C; display: inline-grid; place-items: center; flex: none; aspect-ratio: 3 / 4; width: 6rem; overflow: hidden; border-radius: 20px;
  border: 5px solid var(--rank); padding: .15rem; position: relative;
  background: radial-gradient(circle at 50% 30%, #fff 0%, color-mix(in srgb, var(--rank-l) 70%, #fff) 45%, var(--rank-l) 100%);
  box-shadow: 0 0 0 3px var(--k), inset 0 0 0 2px rgba(255, 255, 255, .7), 0 5px 0 3px var(--k); }
.portrait::after { content: ""; position: absolute; inset: 0; border-radius: 15px; pointer-events: none;
  background: linear-gradient(160deg, rgba(255, 255, 255, .45) 0%, transparent 35%); }
.char-art { display: grid; place-items: center; width: 100%; height: 100%; }
.char-art img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.char-art .kid { width: 100%; height: auto; }
.char-art.none .emo { width: 55%; height: auto; opacity: .7; }
.card-kid { width: 4.4rem; }
.mc-top { grid-template-areas: "kid name bal" "kid where where" "kid rank rank"; }
.mc-top .rank { grid-area: rank; justify-self: start; }
.rank, .pf-rank { display: inline-block; font-size: .75rem; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: #fff;
  background: var(--rank, #CD7F32); border: 2px solid var(--k); border-radius: 999px; padding: .05rem .55rem; text-shadow: 0 1px 0 var(--k); }
.pf-rank { text-transform: none; letter-spacing: 0; font-size: .85rem; }
.pf-kid .portrait { width: 9.5rem; }
.pf-kid .char-art img { object-fit: contain; object-position: center bottom; }
@media (max-width: 600px) { .pf-kid .portrait { width: 7.5rem; } }
.tk-kid { width: 5.5rem; }
.tk-rankup { display: grid; justify-items: center; gap: .4rem; animation: pop .6s .3s cubic-bezier(.2, 1.6, .4, 1) both; }
.pillc.gift { background: var(--yellow); color: #1D1240; }
/* Gran viajero: marco de diamante con brillo */
.portrait.diamond { border-color: #BDEBFF; box-shadow: 0 0 0 3px var(--k), inset 0 0 0 2px #fff, 0 0 14px 3px rgba(127, 211, 255, .8), 0 5px 0 3px var(--k); }
.portrait.diamond::after { background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .8) 45%, transparent 60%); background-size: 250% 100%; animation: diamond 2.6s ease-in-out infinite; }
@keyframes diamond { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.tk-rank { margin: 0; font-family: var(--font-display); font-size: 1.4rem; color: #fff; -webkit-text-stroke: 5px var(--k); paint-order: stroke fill; }
.avatar .av-svg, .avatar .av-svg svg { display: block; width: 100%; height: 100%; }
.avatar img { object-fit: cover; object-position: center top; }

/* Elegir personaje */
.char-grid { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(8.2rem, 1fr)); margin: 1rem 0; }
.char-pick { display: grid; justify-items: center; gap: .2rem; padding: .7rem .5rem .6rem; border-radius: 20px; border: 4px solid var(--k); color: #1D1240;
  background: linear-gradient(180deg, #fff, color-mix(in srgb, var(--c) 30%, #fff)); box-shadow: 0 5px 0 var(--k); text-align: center; }
.char-pick .char-art { width: 80%; aspect-ratio: 3 / 4; height: auto; }
.char-pick b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; line-height: 1; }
.char-pick small { font-weight: 800; font-size: .78rem; line-height: 1.15; }
.char-pick .taken { font-size: .7rem; font-weight: 900; background: var(--k); color: #fff; border-radius: 999px; padding: 0 .5rem; }
.char-pick[aria-pressed="true"] { outline: 5px solid var(--yellow); outline-offset: 2px; }
.char-pick:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--k); }
.mk-mini { width: 5.5rem; aspect-ratio: 3 / 4; height: auto; }

/* Baúl de recuerdos */
.chest-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.chest-ico .emo, .chest-ico img { width: 5rem; height: 5rem; object-fit: contain; }
.chest-ico.open .emo, .chest-ico.open img { animation: chestpop .9s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes chestpop { 0% { transform: scale(.5) rotate(-12deg); } 60% { transform: scale(1.15) rotate(6deg); } }
.chest-count { margin: 0; font-family: var(--font-display); font-size: 1.5rem; }
.chest-new { display: flex; align-items: center; gap: .6rem; }
.chest-new strong { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; }
.chest-grid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(8.4rem, 1fr)); }
.chest-grid.mini { width: 100%; grid-template-columns: repeat(auto-fit, minmax(8rem, 10.5rem)); justify-content: center; }
/* Billete: el baúl se sacude, se abre y el recuerdo sale volando hasta su sitio */
.chest-ico.swap { display: inline-grid; }
.chest-ico.swap > span { grid-area: 1 / 1; display: grid; }
.chest-ico .c-closed { animation: chestshake .6s ease-in-out both, hideit 0s .6s forwards; }
.chest-ico .c-open { opacity: 0; animation: showit .5s .6s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes chestshake { 20% { transform: rotate(-9deg); } 40% { transform: rotate(9deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
@keyframes hideit { to { opacity: 0; } }
@keyframes showit { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
.chest-grid.mini .souv { animation: flyout .9s 1s cubic-bezier(.2, 1.3, .4, 1) both; }
.chest-grid.mini .souv:nth-child(2) { animation-delay: 1.5s; }
@keyframes flyout { from { transform: translate(-7rem, -6rem) scale(.15) rotate(-25deg); opacity: 0; } 50% { opacity: 1; } to { transform: none; opacity: 1; } }
.souv { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; align-items: center; gap: .15rem; aspect-ratio: 4 / 5; padding: .3rem .25rem .4rem;
  border-radius: 18px; border: 4px solid var(--k); color: #3A2410; box-shadow: 0 5px 0 var(--k); overflow: hidden; text-align: center;
  background: radial-gradient(circle at 50% 38%, #FFFDF4 0%, #F8EBC8 55%, #E9CF92 100%); }
.souv .sv-pic { display: grid; place-items: center; width: 100%; height: 100%; min-height: 0; }
.souv .sv-pic .emo, .souv .sv-pic img { width: 72%; height: auto; max-height: 100%; object-fit: contain; filter: drop-shadow(0 4px 0 rgba(58, 36, 16, .25)); }
.souv .sv-pic img { width: 100%; height: 100%; }
.souv .sv-t { font-weight: 900; font-size: .8rem; line-height: 1.1; }
.souv .sv-flag { position: absolute; top: .3rem; left: .3rem; }
.souv .sv-flag .emo { width: 1.4rem; height: 1.4rem; }
.souv.trophy { background: radial-gradient(circle at 50% 35%, #FFF6C4 0%, #FFD24D 50%, #F0A800 100%); }
.souv.trophy::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .7) 45%, transparent 60%); animation: shine 2.6s ease-in-out infinite; }
@keyframes shine { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
.souv.locked { background: #A7AEBD; color: #E8EBF2; }
.souv.locked .sv-pic .emo, .souv.locked .sv-pic img { filter: brightness(0) opacity(.28); }
.souv.locked::after { display: none; }
button.souv:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--k); }
.souv-detail { display: grid; gap: .8rem; justify-items: center; }
.sd-pic { width: 11rem; height: 11rem; display: grid; place-items: center; border-radius: 26px; border: 4px solid var(--k); box-shadow: 0 5px 0 var(--k);
  background: radial-gradient(circle at 50% 38%, #FFFDF4 0%, #F8EBC8 55%, #E9CF92 100%); }
.sd-pic.trophy { background: radial-gradient(circle at 50% 35%, #FFF6C4 0%, #FFD24D 50%, #F0A800 100%); }
.sd-pic .emo, .sd-pic img { width: 75%; height: 75%; object-fit: contain; }
.souv-detail .ficha { width: 100%; }

/* Mapa del mundo */
.map-wrap { margin: .9rem 0; border: 4px solid var(--k); border-radius: 20px; overflow: hidden; box-shadow: 0 6px 0 var(--k); background: #2E8BFF; }
.map-svg { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 466; }
.map-land path { fill: #A8DB8A; stroke: #2F5E2B; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.map-land path.route { fill: #F6E2A6; }
.map-land path.here { fill: #FFC21A; }
.map-svg.illus .map-land path { fill: transparent; stroke: rgba(29, 18, 64, .28); }
.map-svg.illus .map-land path.route { fill: transparent; }
.map-svg.illus .map-land path.here { fill: rgba(255, 194, 26, .55); stroke: #1D1240; stroke-width: 1.5; }
.map-route { fill: none; stroke: #1D1240; stroke-width: 2; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; opacity: .75; }
.map-stop { fill: #fff; stroke: #1D1240; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.map-stop.done { fill: #FFC21A; }
.map-pin { cursor: pointer; }
.map-pin .pin-tail { fill: #1D1240; }
.map-pin .pin-ring { stroke: #1D1240; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.map-pin .pin-name { font-family: var(--font-display); fill: #fff; stroke: #1D1240; stroke-width: 3; paint-order: stroke fill; vector-effect: non-scaling-stroke; }
.map-pin .pin-initial { font-family: var(--font-display); fill: #1D1240; }
.map-pin:focus { outline: none; }
.map-pin:focus-visible .pin-ring { stroke: #FFD43B; stroke-width: 5; }
.map-list { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); }
.map-who { display: flex; align-items: center; gap: .7rem; padding: .5rem .8rem; border-radius: 18px; border: 3px solid var(--k); background: var(--surface); color: var(--fg); box-shadow: 0 4px 0 var(--k); text-align: left; }
.map-who .grow { flex: 1; min-width: 0; display: grid; }
.map-who .emo { width: 2rem; height: 2rem; }
.map-who:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--k); }

/* La vuelta al mundo */
.route-list { display: grid; gap: 1rem; margin-top: .8rem; }
.route-ct { padding: .9rem 1rem; display: grid; gap: .6rem; }
.route-flags { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .45rem; }
.route-flags li { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .55rem .15rem .25rem; border-radius: 999px; border: 3px solid var(--k); background: var(--surface-2); font-size: .85rem; font-weight: 900; }
.route-flags li.here { background: var(--yellow); color: #1D1240; }
.route-flags li .emo { width: 1.5rem; height: 1.5rem; }
.route-flags li b { font-family: var(--font-display); font-weight: 400; color: var(--ink); }
.route-flags li .avatar { width: 1.8rem; height: 1.8rem; border-width: 2px; }
@keyframes pop { from { transform: scale(.4) rotate(-6deg); opacity: 0; } }
/* Etiquetas cortas con la letra de los títulos (Lilita One, un solo grosor); las frases van en Fredoka */
.where, .rank, .pf-rank, .tk-rank, .tk-rankup, .pf-sub, .week, .rank-name, .chip, .seg button, .tab, .btn, .pill, .map-who b, .chal-meta {
  font-family: var(--font-display); font-weight: 400; letter-spacing: .01em; }
/* Premios en el iPhone: lista compacta (icono, nombre y precio, botón a la derecha) para ver al menos 4 sin deslizar mucho */
@media (max-width: 640px) {
  .rewards { grid-template-columns: minmax(0, 1fr); gap: .6rem; }
  .reward { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; grid-template-areas: "ico t need" "ico cost need" "ico prog prog";
    align-items: center; justify-items: start; column-gap: .75rem; row-gap: .2rem; padding: .55rem .8rem .65rem; text-align: left; }
  .reward .ico { grid-area: ico; font-size: 2.6rem; justify-self: center; }
  .reward .t { grid-area: t; font-size: 1rem; }
  .reward .cost { grid-area: cost; font-size: 1.1rem; }
  .reward .progress { grid-area: prog; width: 100%; margin: .15rem 0 0; }
  .reward .need { grid-area: need; justify-self: end; white-space: nowrap; }
  /* «¿Quién canjea?»: los miembros en fila, cada uno en una columna (cara, nombre y estrellas) */
  .who { padding: .7rem .8rem .8rem; gap: .5rem; margin-bottom: .9rem; }
  .who .col-title { font-size: 1.1rem; }
  .who .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.6rem, 1fr)); gap: .45rem; width: 100%; }
  .who .chip { flex-direction: column; justify-content: center; gap: .15rem; min-height: 0; padding: .4rem .3rem; border-radius: 16px; min-width: 0; }
  .who .chip .pill { font-size: .8rem; padding: .05rem .5rem; }
}
/* Ambiente del continente: ilustración (art/fondos) o paisaje con degradados */
.scene-europa { --scene: radial-gradient(70% 55% at 18% 100%, #86C95B 0 98%, transparent 100%), radial-gradient(80% 60% at 82% 100%, #6CB84C 0 98%, transparent 100%), linear-gradient(#A9DCFF, #E8F6FF); }
.scene-america { --scene: radial-gradient(60% 50% at 15% 100%, #2F9E5B 0 98%, transparent 100%), radial-gradient(70% 75% at 75% 100%, #8E9AA8 0 30%, transparent 31%), radial-gradient(90% 45% at 60% 100%, #48B26B 0 98%, transparent 100%), linear-gradient(#9FE6D4, #E9FFF7); }
.scene-africa { --scene: radial-gradient(14% 22% at 78% 38%, #FFF2B8 0 60%, transparent 62%), radial-gradient(110% 40% at 50% 100%, #E1A24A 0 98%, transparent 100%), linear-gradient(#FFC37A, #FFEBC4); }
.scene-asia { --scene: radial-gradient(35% 70% at 70% 100%, #9C8FB8 0 98%, transparent 100%), radial-gradient(70% 45% at 20% 100%, #86C48A 0 98%, transparent 100%), linear-gradient(#FFD0E1, #FFF2F7); }
.scene-oceania { --scene: linear-gradient(transparent 0 72%, #F3DB98 72%), radial-gradient(120% 30% at 50% 72%, #2EC4D6 0 98%, transparent 100%), linear-gradient(#8FE4FF, #E5FAFF); }
.pf-scene { position: absolute; inset: 0; background: var(--scene); }
.pf-scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255, 255, 255, .55) 0 40%, rgba(255, 255, 255, .1) 80%); }
.pf-hero .pf-stripes { inset: 0 0 auto 0; height: .7rem; opacity: 1; border-bottom: 3px solid var(--k); }
.mcard::before { background: linear-gradient(color-mix(in srgb, var(--c) 30%, transparent), color-mix(in srgb, var(--c) 30%, transparent)), var(--scene, color-mix(in srgb, var(--c) 30%, var(--surface))); }
/* Prueba del país */
.quiz { display: grid; gap: .8rem; justify-items: center; text-align: center; }
.quiz-step { margin: 0; color: var(--muted); }
.quiz-q { font-size: 1.5rem; margin: 0; }
.quiz-pic .emo, .quiz-pic img { width: 7rem; height: 7rem; object-fit: contain; }
.quiz-pic.flag .emo { width: 8rem; height: 8rem; }
.quiz-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; width: 100%; }
.quiz-opt { min-height: 3.6rem; padding: .5rem .8rem; border-radius: 18px; border: 3px solid var(--k); background: var(--surface); color: var(--fg); box-shadow: 0 4px 0 var(--k); font-size: 1.1rem; line-height: 1.15; }
.quiz-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--k); }
.quiz-opt.right { background: #7BD88F; color: #0E3B18; animation: pop .4s; }
.quiz-opt.wrong { background: #FF8A8A; color: #4A0C0C; animation: shake .4s; }
.quiz-opt.dim { opacity: .45; }
.quiz-opt:disabled { cursor: default; }
.quiz-fb { margin: 0; font-family: var(--font-display); font-size: 1.3rem; }
.quiz-fb.ok { color: var(--good); } .quiz-fb.ko { color: var(--bad); }
.quiz-end { display: grid; justify-items: center; gap: .6rem; }
.quiz-big .emo { width: 6rem; height: 6rem; }
.quiz-cta { display: grid; gap: .5rem; justify-items: start; }
.quiz-cta .sub { margin: 0; }
.quiz-done { margin: 0; font-weight: 600; color: var(--good); }
.tk-btns { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
/* Vuelo en el billete */
.fm-wrap { width: 100%; border: 3px solid var(--k); border-radius: 16px; overflow: hidden; background: #2E8BFF; }
.fm-svg { aspect-ratio: 2 / 1; }
.map-land path.from { fill: rgba(255, 255, 255, .45); stroke: #1D1240; stroke-width: 1.2; }
.fm-route { fill: none; stroke: #1D1240; stroke-width: 2; stroke-dasharray: 5 5; vector-effect: non-scaling-stroke; opacity: .35; }
.fm-trail { fill: none; stroke: #FF4FA3; stroke-width: 3.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.fm-ring { fill: none; stroke: #FFC21A; stroke-width: 3; vector-effect: non-scaling-stroke; opacity: 0; }
.fm-svg.landed .fm-ring { animation: ring 1.2s ease-out infinite; }
.map-stop.here { fill: #FFC21A; }
@keyframes ring { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.6); } }
.fm-ring { transform-box: fill-box; transform-origin: center; }
/* Pasaporte */
.pp { display: grid; gap: 1rem; }
.pp-cover { display: flex; align-items: center; gap: .8rem; padding: .8rem 1rem; border-radius: 18px; border: 3px solid var(--k); background: #1F3B73; color: #fff; box-shadow: 0 4px 0 var(--k); }
.pp-cover b { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; display: block; }
.pp-cover .pf-sub { color: #D7E3FF; }
.pp-cover > .emo { width: 2.6rem; height: 2.6rem; }
.pp-page { padding: .8rem 1rem 1rem; border-radius: 16px; border: 3px solid var(--k); box-shadow: 0 4px 0 var(--k);
  background: repeating-linear-gradient(0deg, transparent 0 22px, rgba(120, 90, 40, .07) 22px 23px), #FFF8E6; color: #2A2140; }
.pp-h { display: flex; align-items: center; gap: .5rem; margin: 0 0 .6rem; font-size: 1.25rem; }
.pp-h .emo { width: 1.8rem; height: 1.8rem; }
.pp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.2rem, 1fr)); gap: .6rem; }
.pp-slot { position: relative; aspect-ratio: 1; display: grid; place-items: center; border-radius: 14px; padding: .2rem; background: transparent; border: 0; }
.pp-stamp { width: 100%; height: 100%; mix-blend-mode: multiply; opacity: .92; }
.st-t { font-family: var(--font-display); letter-spacing: .02em; }
.pp-slot.empty { border: 2px dashed rgba(42, 33, 64, .25); }
.pp-q { font-family: var(--font-display); font-size: 2rem; color: rgba(42, 33, 64, .25); }
.pp-slot.next .emo { width: 2.6rem; height: 2.6rem; opacity: .45; filter: grayscale(.4); }
.pp-quiz { position: absolute; right: .1rem; top: .1rem; }
.pp-quiz .emo { width: 1.5rem; height: 1.5rem; }
.stamp-detail { display: grid; gap: .8rem; justify-items: center; }
.sd-stamp { width: 12rem; height: 12rem; padding: .6rem; border-radius: 20px; background: #FFF8E6; border: 3px solid var(--k); }
.stamp-detail .ficha, .stamp-detail .pf-box { width: 100%; }
a.btn { text-decoration: none; }
/* iPhone: la barra de abajo en su propia capa para que no se mueva al desplazar, y los campos a 16 px como mínimo
   (con menos, Safari amplía la página al escribir y la barra parece subir con el contenido) */
.tabs { transform: translateZ(0); -webkit-backface-visibility: hidden; backface-visibility: hidden; }
input, textarea, select { font-size: max(16px, 1em); }
