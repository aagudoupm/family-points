<title>Family Points</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Points">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: tablero de pegatinas. Barra lateral de pestañas en horizontal, barra inferior en vertical/estrecho. */
/* Tema Aventura: cielo, sol, nubes y colinas detrás; tarjetas blancas con relieve; botones «de juego» que se hunden.
   De noche (modo oscuro), el mismo paisaje con luna y estrellas. */
:root {
  --bg: #BFE6FF; --surface: #FFFFFF; --surface-2: #EEF4FA; --fg: #16304F; --muted: #4E6886; --line: #DCE6F1;
  --star: #FFB703; --star-ink: #7A5200; --good: #2EA44F; --good-bg: #E2F6E6; --good-edge: #208A3D; --bad: #E4533C; --bad-bg: #FDE6E1; --bad-edge: #B63A27;
  --ink: #2563C9; --ink-fg: #FFFFFF; --ink-edge: #1A4A9C; --edge: #D3DEEB;
  --sky-1: #5DBBFF; --sky-2: #A9DEFF; --sky-3: #DDF3FF; --hill-1: #8BD46A; --hill-2: #6DC24F; --hill-3: #A6E08A;
  --sun: #FFD84D; --sun-glow: rgba(255, 216, 77, .35); --cloud: rgba(255, 255, 255, .92); --night-stars: 0;
  --shadow: 0 6px 0 rgba(22, 48, 79, .08), 0 14px 30px rgba(22, 48, 79, .12);
  --tab-on: #FFF0B8; --tab-on-fg: #7A5200;
  --font-display: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  --radius: 26px;
  --tap: 3.5rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A3D; --surface: #17244A; --surface-2: #213263; --fg: #EAF1FF; --muted: #A9B9DA; --line: #2B3C6E;
    --star: #FFCF4A; --star-ink: #FFE7A3; --good: #4CD07A; --good-bg: #173A2C; --good-edge: #2F9A55; --bad: #FF7B66; --bad-bg: #432124; --bad-edge: #C9533F;
    --ink: #6FA8FF; --ink-fg: #0B1430; --ink-edge: #3F74C9; --edge: #0B1430;
    --sky-1: #08122E; --sky-2: #1A2A5E; --sky-3: #2E3F7C; --hill-1: #1E4A3A; --hill-2: #163A2D; --hill-3: #275C47;
    --sun: #F4F1DE; --sun-glow: rgba(244, 241, 222, .18); --cloud: rgba(170, 190, 240, .18); --night-stars: 1;
    --shadow: 0 6px 0 rgba(0, 0, 0, .25), 0 14px 30px rgba(0, 0, 0, .3);
    --tab-on: rgba(255, 207, 74, .18); --tab-on-fg: #FFCF4A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0E1A3D; --surface: #17244A; --surface-2: #213263; --fg: #EAF1FF; --muted: #A9B9DA; --line: #2B3C6E;
    --star: #FFCF4A; --star-ink: #FFE7A3; --good: #4CD07A; --good-bg: #173A2C; --good-edge: #2F9A55; --bad: #FF7B66; --bad-bg: #432124; --bad-edge: #C9533F;
    --ink: #6FA8FF; --ink-fg: #0B1430; --ink-edge: #3F74C9; --edge: #0B1430;
    --sky-1: #08122E; --sky-2: #1A2A5E; --sky-3: #2E3F7C; --hill-1: #1E4A3A; --hill-2: #163A2D; --hill-3: #275C47;
    --sun: #F4F1DE; --sun-glow: rgba(244, 241, 222, .18); --cloud: rgba(170, 190, 240, .18); --night-stars: 1;
    --shadow: 0 6px 0 rgba(0, 0, 0, .25), 0 14px 30px rgba(0, 0, 0, .3);
    --tab-on: rgba(255, 207, 74, .18); --tab-on-fg: #FFCF4A;
    color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
/* Dynamic Type: en iPad el tamaño base sigue el ajuste de texto del sistema */
html { font: -apple-system-body; font-family: var(--font-body); }
@supports not (font: -apple-system-body) { html { font-size: 17px; } }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 1rem; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 12px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: .35rem .5rem calc(.35rem + env(safe-area-inset-bottom, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: .1rem; flex: 1 1 0; min-width: 0; max-width: 6.5rem; padding: .35rem .15rem;
  border-radius: 16px; color: var(--muted); font-size: .78rem; font-weight: 600; }
.tab span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 440px) { .tab { font-size: .68rem; } .tabs { padding-inline: .25rem; } }
.tab svg { width: 1.9rem; height: 1.9rem; }
.tab[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.main { padding-inline: 16px; padding-block: 1.25rem calc(6.5rem + env(safe-area-inset-bottom, 0px)); min-width: 0; }
@media (min-width: 900px) {
  .app { grid-template-columns: 6.5rem 1fr; }
  .tab { flex: none; max-width: none; }
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; flex-direction: column; justify-content: flex-start;
    gap: .5rem; border-top: 0; border-right: 1px solid var(--line); padding: 1rem .5rem; }
  .tabs .brand { display: grid; }
  .main { padding-inline: 28px; padding-block: 1.5rem 2rem; }
}
.brand { display: none; place-items: center; width: 3.4rem; height: 3.4rem; margin: 0 auto .75rem; border-radius: 18px;
  background: var(--star); color: var(--star-ink); }
.brand svg { width: 2rem; height: 2rem; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.page-head h1 { font-size: 2rem; }
.sub { color: var(--muted); }
.section-title { font-family: var(--font-display); font-size: 1.35rem; margin: 1.75rem 0 .75rem; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: var(--tap); padding: 0 1.25rem;
  border-radius: 999px; font-weight: 700; background: var(--surface-2); color: var(--fg); }
.btn.primary { background: var(--ink); color: var(--ink-fg); }
.btn.good { background: var(--good); color: #fff; }
.btn.bad { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn svg { width: 1.2rem; height: 1.2rem; }
.btn.small { min-height: 2.75rem; padding: 0 1rem; font-size: .92rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: scale(.97); }
.icon-btn { display: inline-grid; place-items: center; width: 2.9rem; height: 2.9rem; border-radius: 999px; background: var(--surface-2); font-size: 1.2rem; }
.icon-btn svg { width: 1.4rem; height: 1.4rem; }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.9rem; padding: 0 1rem 0 .4rem; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--line); font-weight: 600; }
.chip.text { padding: 0 1rem; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 22px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { min-height: 2.6rem; padding: 0 1rem; border-radius: 999px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* ---------- Avatares ---------- */
.avatar { --c: var(--ink); display: inline-grid; place-items: center; flex: none; width: 2.2rem; height: 2.2rem; border-radius: 50%;
  background: var(--c); font-size: 1.25rem; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 6.5rem; height: 6.5rem; font-size: 3.6rem; box-shadow: 0 0 0 5px var(--surface), 0 0 0 8px var(--c); }
.avatar.md { width: 3.4rem; height: 3.4rem; font-size: 1.9rem; }

/* ---------- Panel ---------- */
.dash { display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .dash { grid-template-columns: 1fr 20rem; align-items: start; } }
.members { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
.mcard { --c: var(--ink); position: relative; display: flex; flex-direction: column; align-items: center; gap: .6rem; padding: 1.5rem 1rem 1.25rem;
  border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); text-align: center; overflow: hidden;
  border: 2px solid transparent; transition: transform .15s ease; }
.mcard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4.6rem; background: color-mix(in srgb, var(--c) 22%, var(--surface)); }
.mcard > * { position: relative; }
.mcard:active { transform: scale(.98); }
.mcard .name { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.balance { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1;
  font-variant-numeric: tabular-nums; }
.balance .star { width: 1.9rem; height: 1.9rem; color: var(--star); }
.balance.neg { color: var(--bad); }
.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.18); } }
.mcard .week { font-size: .85rem; color: var(--muted); font-weight: 600; }
@media (max-width: 500px) {
  .members { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .mcard { padding: 1rem .5rem .9rem; gap: .4rem; }
  .mcard::before { height: 3.2rem; }
  .mcard .avatar.lg { width: 4.4rem; height: 4.4rem; font-size: 2.5rem; box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--c); }
  .mcard .name { font-size: 1.2rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mcard .balance { font-size: 2rem; }
  .mcard .balance .star { width: 1.5rem; height: 1.5rem; }
  .mcard .week { font-size: .75rem; }
  .page-head h1 { font-size: 1.7rem; }
}
.ranking { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem; }
.ranking h2 { font-size: 1.35rem; margin-bottom: .2rem; }
.rank-list { list-style: none; margin: .75rem 0 0; padding: 0; display: grid; gap: .5rem; }
.rank-list li { display: grid; grid-template-columns: 2.2rem auto 1fr auto; align-items: center; gap: .6rem; padding: .5rem .6rem; border-radius: 16px; }
.rank-list li.first { background: color-mix(in srgb, var(--star) 18%, var(--surface)); }
.rank-pos { font-family: var(--font-display); font-size: 1.4rem; text-align: center; }
.rank-name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-pts { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }

/* ---------- Hojas (modales) ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; background: rgba(10, 14, 24, .45);
  animation: fade .18s ease; padding-top: calc(2rem + env(safe-area-inset-top, 0px)); }
@media (min-width: 700px) { .overlay { place-items: center; padding: 2rem; } }
.sheet { width: 100%; max-width: 40rem; max-height: 100%; overflow: auto; background: var(--bg); border-radius: 28px 28px 0 0;
  padding: 1.25rem 16px calc(1.5rem + env(safe-area-inset-bottom, 0px)); animation: rise .22s ease; -webkit-overflow-scrolling: touch; }
.sheet.wide { max-width: 64rem; }
@media (min-width: 700px) { .sheet { border-radius: 28px; padding: 1.5rem 1.75rem; } }
.sheet-head { display: flex; align-items: center; gap: .9rem; margin-bottom: 1.1rem; }
.sheet-head h2 { font-size: 1.6rem; flex: 1; min-width: 0; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }

/* Asignar puntos */
.assign-cols { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
@media (min-width: 640px) { .assign-cols { grid-template-columns: 1fr 1fr; } }
.col-title { display: flex; align-items: center; gap: .5rem; font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 .6rem; }
.col-title .dot { width: .9rem; height: .9rem; border-radius: 50%; }
.rule-grid { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); }
.rule { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; min-height: 8rem;
  padding: .75rem .5rem; border-radius: 20px; text-align: center; font-weight: 600; line-height: 1.15; border: 2px solid transparent; }
.rule .ico { font-size: 2.6rem; line-height: 1; }
.rule .pts { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; }
.rule.pos { background: var(--good-bg); }
.rule.pos .pts { color: var(--good); }
.rule.neg { background: var(--bad-bg); }
.rule.neg .pts { color: var(--bad); }
.rule:active { transform: scale(.95); }
.rule.pos:active { border-color: var(--good); }
.rule.neg:active { border-color: var(--bad); }
.float { position: fixed; z-index: 70; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 2.4rem;
  animation: floatUp .9s ease-out forwards; }
@keyframes floatUp { to { transform: translateY(-80px); opacity: 0; } }
.custom-box { margin-top: 1.25rem; padding: 1rem; background: var(--surface); border-radius: 20px; display: grid; gap: .8rem; }
.stepper { display: flex; align-items: center; gap: .75rem; }
.stepper .val { min-width: 4.5rem; text-align: center; font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; }
.stepper button { width: var(--tap); height: var(--tap); border-radius: 50%; font-size: 1.8rem; font-weight: 700; }

/* ---------- Formularios ---------- */
.field { display: grid; gap: .35rem; }
.field > span { font-weight: 700; font-size: .9rem; color: var(--muted); }
.input { width: 100%; min-height: 3.2rem; padding: .6rem .9rem; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }
.input:focus { outline: none; border-color: var(--ink); }
.form { display: grid; gap: 1rem; }
.form-actions { display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .5rem; }
.form-actions .spacer { flex: 1; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(3rem, 1fr)); gap: .35rem; max-height: 11rem; overflow: auto; padding: 2px; }
.emoji-grid button { height: 3rem; border-radius: 12px; font-size: 1.6rem; background: var(--surface); border: 2px solid transparent; }
.emoji-grid button[aria-pressed="true"] { border-color: var(--ink); }
.swatches { display: flex; gap: .5rem; flex-wrap: wrap; }
.swatch { width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--fg); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.2rem; }
.toggle { position: relative; width: 3.6rem; height: 2.1rem; border-radius: 999px; background: var(--line); flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.toggle[aria-checked="true"] { background: var(--good); }
.toggle[aria-checked="true"]::after { transform: translateX(1.5rem); }

/* ---------- Listas ---------- */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: .8rem; padding: .7rem 1rem; min-height: 4rem; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--muted); font-size: .85rem; }
.row .ico { font-size: 1.8rem; width: 2.4rem; text-align: center; flex: none; }
.row button.grow { text-align: left; display: flex; align-items: center; gap: .8rem; }
.pill { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; padding: .15rem .7rem; border-radius: 999px; white-space: nowrap; }
.pill.pos { background: var(--good-bg); color: var(--good); }
.pill.neg { background: var(--bad-bg); color: var(--bad); }
.pill.neu { background: var(--surface-2); color: var(--muted); }
.day-head { font-family: var(--font-display); font-size: 1.1rem; margin: 1.25rem 0 .5rem; color: var(--muted); }
.filters { display: grid; gap: .75rem; margin-bottom: .5rem; }
.date-range { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.date-range .input { width: auto; min-height: 2.9rem; }
.empty { display: grid; justify-items: center; gap: .6rem; text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
.empty .big { font-size: 3.5rem; }

/* ---------- Recompensas ---------- */
.rewards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }
.reward { display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: 1.25rem .75rem 1rem; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow); text-align: center; border: 2px solid transparent; }
.reward .ico { font-size: 3.4rem; line-height: 1.1; }
.reward .t { font-weight: 700; line-height: 1.2; }
.cost { display: inline-flex; align-items: center; gap: .25rem; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; }
.cost .star { width: 1.3rem; height: 1.3rem; color: var(--star); }
.reward.locked { opacity: .55; }
.reward .need { font-size: .85rem; color: var(--muted); font-weight: 600; }
.reward:not(.locked) { border-color: var(--star); }
.reward:not(.locked) .need { background: var(--star); color: #2A1E00; padding: .3rem 1rem; border-radius: 999px; font-weight: 800; font-size: .95rem; }
.progress { width: 100%; height: .55rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--star); border-radius: 999px; }
.who { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem; margin-bottom: 1.25rem; }

/* ---------- Estadísticas ---------- */
.stats-grid { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .stats-grid { grid-template-columns: 3fr 2fr; } }
.chart-card { padding: 1.25rem; min-width: 0; }
.chart-card h2 { font-size: 1.3rem; }
.chart-wrap { position: relative; margin-top: .75rem; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
.chart-wrap .zero { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  border-radius: 12px; padding: .5rem .7rem; box-shadow: var(--shadow); font-size: .85rem; min-width: 8rem; }
.tip b { display: block; margin-bottom: .2rem; font-family: var(--font-display); }
.tip .r { display: flex; align-items: center; gap: .4rem; justify-content: space-between; }
.tip .k { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; }
.legend { display: flex; gap: .4rem 1rem; flex-wrap: wrap; margin-top: .6rem; font-size: .9rem; color: var(--fg); }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; }
.bars { display: grid; gap: .55rem; margin-top: .8rem; }
.bar-row { display: grid; grid-template-columns: 2rem minmax(0, 9rem) 1fr 2.5rem; align-items: center; gap: .5rem; }
.bar-row .lab { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 1.1rem; }
.bar-row .fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 4px; }
.bar-row .fill.pos { background: var(--good); }
.bar-row .fill.neg { background: var(--bad); }
.bar-row .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; margin-top: .8rem; }
table.data { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: .4rem .6rem; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; }
.tiles { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); margin-bottom: 1.25rem; }
.tile { padding: 1rem; display: flex; align-items: center; gap: .7rem; }
.tile .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: .8rem; color: var(--muted); font-weight: 600; }

/* ---------- Ajustes ---------- */
.settings { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
.settings > div { min-width: 0; }
@media (min-width: 1000px) { .settings { grid-template-columns: 1fr 1fr; align-items: start; } }
.set-card { padding: 1.1rem 1.1rem .6rem; }
.set-card h2 { font-size: 1.3rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .4rem; }
.set-card .row { padding-inline: 0; }
.order-btns { display: flex; gap: .25rem; }
.order-btns .icon-btn { width: 2.6rem; height: 2.6rem; }
.note { font-size: .85rem; color: var(--muted); margin: .25rem 0 .75rem; }
.banner { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; padding: .9rem 1rem; border-radius: 18px;
  background: color-mix(in srgb, var(--star) 20%, var(--surface)); margin-bottom: 1.25rem; }
.banner p { margin: 0; flex: 1; min-width: 12rem; }

/* ---------- Barra: Ajustes solo en la barra lateral ---------- */
.tab.rail-only { display: none; }
@media (min-width: 900px) { .tab.rail-only { display: flex; margin-top: auto; } }
.view-switch { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
.banners { display: grid; gap: .75rem; margin-bottom: 1.25rem; }
.banners:empty { display: none; }
.banners .banner { margin: 0; }

/* ---------- Retos ---------- */
.chal-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 21rem), 1fr)); align-items: start; }
.chal { padding: .9rem 1rem .5rem; min-width: 0; }
.chal-head { display: flex; align-items: center; gap: .75rem; width: 100%; text-align: left; padding-bottom: .5rem; }
.chal-ico { font-size: 2.3rem; line-height: 1; flex: none; }
.chal-title { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.chal-meta { display: block; color: var(--muted); font-size: .82rem; }
.chal-name { display: block; font-weight: 700; font-size: .92rem; }
.chal-row { display: flex; align-items: center; gap: .7rem; padding: .6rem 0; border-top: 1px solid var(--line); }
.chal-row .grow { flex: 1; min-width: 0; display: grid; gap: .25rem; }
.chal-who { display: inline-flex; flex: none; }
.chal-who .avatar + .avatar { margin-left: -.7rem; box-shadow: 0 0 0 2px var(--surface); }
.bar { display: block; height: .75rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; transition: width .5s ease; }
.bar.failed > i { background: var(--bad) !important; }
.st { flex: none; font-size: .78rem; font-weight: 800; padding: .3rem .7rem; border-radius: 999px; white-space: nowrap; }
.st.active, .st.dismissed { background: var(--surface-2); color: var(--muted); }
.st.ready { background: var(--star); color: #2A1E00; }
.st.confirmed { background: var(--good-bg); color: var(--good); }
.st.failed { background: var(--bad-bg); color: var(--bad); }
.pending-list { display: grid; gap: .75rem; }
.pending { display: flex; align-items: center; gap: .75rem; padding: .8rem 1rem; flex-wrap: wrap; }
.pending .grow { flex: 1; min-width: 10rem; }
.celebrate { display: grid; justify-items: center; gap: .5rem; text-align: center; padding-bottom: .5rem; }
.big-badge { width: 7.5rem; height: 7.5rem; border-radius: 50%; display: grid; place-items: center; font-size: 4rem;
  background: color-mix(in srgb, var(--star) 28%, var(--surface)); box-shadow: 0 0 0 6px var(--star), 0 0 0 12px color-mix(in srgb, var(--star) 30%, transparent);
  animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); margin: .75rem 0; }
@keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } }
.celebrate .ct { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; margin: 0; }
.celebrate .cs { font-size: 1.1rem; margin: 0; font-weight: 600; }
.celebrate .cb { margin: 0; color: var(--muted); font-weight: 600; }
.celebrate .btn { margin-top: .75rem; min-width: 12rem; }

/* Insignias */
.badges { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); }
.badge { display: grid; justify-items: center; gap: .35rem; padding: .9rem .5rem; border-radius: 18px; background: var(--surface-2); text-align: center; font-weight: 700; font-size: .85rem; line-height: 1.2; }
.badge .medal { width: 4rem; height: 4rem; display: grid; place-items: center; font-size: 2.2rem; border-radius: 50%;
  background: color-mix(in srgb, var(--star) 25%, var(--surface)); box-shadow: 0 0 0 3px var(--star); }

/* Más */
.more-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); }
.more-tile { display: grid; justify-items: center; gap: .5rem; padding: 1.4rem .75rem; font-weight: 700; text-align: center; border-radius: var(--radius); }
.more-tile .ico { font-size: 2.5rem; line-height: 1; }
.more-tile:active { transform: scale(.97); }

/* ---------- PIN ---------- */
.pin-dots { display: flex; justify-content: center; gap: 1rem; margin: .5rem 0 1.25rem; }
.pin-dots i { width: 1.2rem; height: 1.2rem; border-radius: 50%; border: 2px solid var(--fg); }
.pin-dots i.on { background: var(--fg); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 5rem); gap: .8rem; justify-content: center; }
.pin-pad button { width: 5rem; height: 5rem; border-radius: 50%; background: var(--surface); font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; box-shadow: var(--shadow); }
.pin-pad button.blank { visibility: hidden; }
.pin-msg { text-align: center; min-height: 1.5rem; color: var(--bad); font-weight: 600; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

/* ---------- Bienvenida ---------- */
.welcome { max-width: 40rem; margin: 3rem auto; text-align: center; display: grid; gap: 1.25rem; justify-items: center; }
.welcome h1 { font-size: 2.6rem; }
.welcome .stars { display: flex; gap: .4rem; color: var(--star); }
.welcome .stars svg { width: 3rem; height: 3rem; }
.welcome .actions { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; }

/* ---------- Toast y confeti ---------- */
.toast { position: fixed; left: 0; right: 0; margin-inline: auto; width: fit-content; bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); z-index: 80;
  display: flex; align-items: center; gap: .8rem; max-width: calc(100% - 32px); padding: .55rem .6rem .55rem 1.1rem;
  background: var(--fg); color: var(--bg); border-radius: 999px; box-shadow: var(--shadow); font-weight: 600; animation: rise .2s ease; }
@media (min-width: 900px) { .toast { bottom: 2rem; } }
.toast button { min-height: 2.6rem; padding: 0 1rem; border-radius: 999px; background: var(--star); color: #2A1E00; font-weight: 800; }
#confetti { position: fixed; inset: 0; z-index: 90; pointer-events: none; width: 100%; height: 100%; }
.status-line { font-size: .8rem; color: var(--muted); text-align: center; margin-top: 2rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* =====================================================================
   Tema Aventura (sobrescribe los estilos base)
   ===================================================================== */
body { background: var(--sky-2); font-weight: 600; }
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, var(--sky-3) 75%); }
.scene::before { content: ""; position: absolute; inset: 0 0 40% 0; opacity: var(--night-stars);
  background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 28% 8%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 44% 26%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 61% 12%, #fff 50%, transparent 51%),
    radial-gradient(2px 2px at 73% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 88% 16%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 36% 40%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 8% 44%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 93% 42%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 54% 6%, #fff 50%, transparent 51%);
  background-size: 420px 300px; }
.scene .sun { position: absolute; width: 9rem; height: 9rem; right: 6%; top: 2.5rem; border-radius: 50%; background: var(--sun);
  box-shadow: 0 0 0 1.4rem var(--sun-glow), 0 0 0 2.8rem color-mix(in srgb, var(--sun-glow) 50%, transparent); }
.scene .cloud { position: absolute; height: 2.6rem; border-radius: 99px; background: var(--cloud); animation: drift 70s linear infinite; }
.scene .cloud::before, .scene .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
.scene .cloud::before { width: 3.4rem; height: 3.4rem; left: 18%; top: -1.6rem; }
.scene .cloud::after { width: 2.4rem; height: 2.4rem; left: 50%; top: -1rem; }
.scene .c1 { width: 8.5rem; top: 12%; left: -10%; animation-duration: 80s; }
.scene .c2 { width: 6rem; top: 28%; left: -20%; animation-duration: 110s; animation-delay: -40s; transform: scale(.8); }
.scene .c3 { width: 7rem; top: 6%; left: -15%; animation-duration: 95s; animation-delay: -70s; }
@keyframes drift { from { translate: 0 0; } to { translate: 130vw 0; } }
.scene .hill { position: absolute; border-radius: 50%; }
.scene .h1 { width: 140vw; height: 42vh; left: -20vw; bottom: -26vh; background: var(--hill-2); }
.scene .h2 { width: 90vw; height: 40vh; right: -25vw; bottom: -20vh; background: var(--hill-1); }
.scene .h3 { width: 80vw; height: 38vh; left: -25vw; bottom: -17vh; background: var(--hill-3); }
.app { position: relative; z-index: 1; }

h1 { font-weight: 800; letter-spacing: -.01em; }
.page-head h1 { font-size: 2.2rem; }
.page-head .sub, .page-head p.sub { color: var(--fg); opacity: .78; font-weight: 700; }
.emo { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: -0.28em; display: inline-block; flex: none; }
.ico .emo, .big .emo, .medal .emo, .big-badge .emo, .chal-ico .emo, .avatar > .emo { width: 1em; height: 1em; vertical-align: middle; }

/* Superficies con relieve */
.card, .ranking, .mcard, .reward, .chal, .set-card, .more-tile, .tile, .list.card, .who.card, .pending.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 0; }
.sheet { background: var(--surface); }
.input { border-radius: 16px; background: var(--surface); border-color: var(--line); }
.banner { background: var(--surface); box-shadow: var(--shadow); border: 3px solid var(--star); border-radius: 22px; }

/* Botones «de juego»: canto inferior que se hunde al tocar */
.btn { --b: var(--surface-2); --e: var(--edge); background: var(--b); color: var(--fg); box-shadow: 0 5px 0 var(--e); border-radius: 18px; font-weight: 800; transition: transform .07s, box-shadow .07s; }
.btn.primary { --b: var(--ink); --e: var(--ink-edge); color: var(--ink-fg); }
.btn.good { --b: var(--good); --e: var(--good-edge); color: #fff; }
.btn.bad { --b: var(--bad); --e: var(--bad-edge); color: #fff; }
.btn.ghost { --b: transparent; --e: transparent; border: 2px solid var(--line); box-shadow: none; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--e); }
.btn.small { border-radius: 14px; }
.icon-btn { background: var(--surface); box-shadow: 0 4px 0 var(--edge); width: 3.1rem; height: 3.1rem; font-size: 1.5rem; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.chip { background: var(--surface); border-color: transparent; box-shadow: 0 3px 0 var(--edge); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); }
.seg { background: color-mix(in srgb, var(--surface) 70%, transparent); box-shadow: inset 0 2px 0 rgba(0, 0, 0, .05); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); box-shadow: 0 3px 0 var(--ink-edge); }

/* Barra: píldora flotante abajo; panel redondeado a la izquierda en el iPad */
.tabs { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: .4rem; border-top: 0; border-radius: 28px;
  background: var(--surface); box-shadow: var(--shadow); }
.tab { color: var(--muted); font-weight: 800; border-radius: 20px; }
.tab .tab-ico { font-size: 1.9rem; line-height: 1; display: inline-flex; transition: transform .2s; }
.tab[aria-current="page"] { background: var(--tab-on); color: var(--tab-on-fg); }
.tab[aria-current="page"] .tab-ico { transform: translateY(-2px) scale(1.08); }
.main { padding-block: 1.25rem calc(7.5rem + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  .tabs { left: auto; right: auto; bottom: auto; margin: 12px 0 12px 12px; height: calc(100dvh - 24px); border-radius: 30px; }
  .main { padding-block: 1.5rem 2rem; }
  .toast { bottom: 2rem; }
}
.toast { bottom: calc(7.2rem + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); }
.brand { background: transparent; font-size: 2.6rem; width: auto; height: auto; }

/* Panel: tarjetas de aventureros */
.members { grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); }
.mcard { --c: var(--ink); display: grid; gap: .65rem; align-items: stretch; text-align: left; padding: 1rem 1.1rem 1rem; overflow: visible; }
.mcard::before { height: 4.6rem; border-radius: var(--radius) var(--radius) 0 0;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, var(--surface)), color-mix(in srgb, var(--c) 12%, var(--surface))); }
.mc-top { display: flex; align-items: center; gap: .8rem; }
.mc-id { display: grid; min-width: 0; flex: 1; }
.mcard .name { font-size: 1.45rem; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lvl { font-size: .82rem; font-weight: 800; color: var(--good); }
.mcard .avatar.lg { width: 4.6rem; height: 4.6rem; font-size: 3rem; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .14), 0 0 0 4px var(--surface), 0 0 0 7px var(--c); }
.mcard .balance { font-size: 2.2rem; margin-left: auto; flex: none; }
.balance .emo.star { width: .8em; height: .8em; vertical-align: -0.05em; }
.goal { display: flex; align-items: center; gap: .35rem; font-size: .9rem; font-weight: 800; color: var(--fg); }
.goal .emo { width: 1.5rem; height: 1.5rem; }
.mc-foot { display: flex; gap: .4rem .9rem; flex-wrap: wrap; }
.mcard .week { font-size: .8rem; }
.mcard:active { transform: scale(.985); }

.trail { position: relative; display: block; height: 3.4rem; margin: .3rem .9rem 0; }
.trail::before { content: ""; position: absolute; left: 0; right: 0; top: 60%; border-top: 5px dashed color-mix(in srgb, var(--star) 55%, var(--line)); transform: translateY(-50%); }
.trail-fill { position: absolute; left: 0; top: 60%; height: 5px; background: var(--star); border-radius: 9px; transform: translateY(-50%); transition: width .6s ease; }
.trail .stop { position: absolute; top: 60%; transform: translate(-50%, -50%); width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--surface-2);
  display: grid; place-items: center; font-size: 1.45rem; box-shadow: 0 3px 0 var(--edge); }
.trail .stop.reached { background: var(--star); }
.trail .walker { position: absolute; top: 60%; width: 2rem; height: 2rem; font-size: 1.6rem; display: grid; place-items: center; transform: translate(-50%, -125%); transition: left .6s ease; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .2)); }
.trail .walker img { width: 2rem; height: 2rem; border-radius: 50%; object-fit: cover; }

.ranking h2 { font-size: 1.4rem; }
.rank-list li.first { background: color-mix(in srgb, var(--star) 22%, var(--surface)); }
.rank-pos .emo { width: 1.6rem; height: 1.6rem; }

/* Dar estrellas: fichas con relieve */
.rule { box-shadow: 0 5px 0 var(--e, var(--edge)); border: 0; transition: transform .07s, box-shadow .07s; }
.rule.pos { --e: color-mix(in srgb, var(--good) 45%, var(--good-bg)); }
.rule.neg { --e: color-mix(in srgb, var(--bad) 40%, var(--bad-bg)); }
.rule:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--e); }
.rule .ico { font-size: 2.8rem; }
.fly { position: fixed; z-index: 90; width: 2.8rem; height: 2.8rem; pointer-events: none; transition: transform .7s cubic-bezier(.5, -0.35, .7, 1), opacity .2s .55s; }
.bounce { animation: bounce .55s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bounce { 35% { transform: translateY(-12px) scale(1.1); } }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px) rotate(-5deg); } 40%, 80% { transform: translateX(6px) rotate(5deg); } }
.sheet-head .avatar.md { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--c); }

/* Premios y retos */
.reward { padding-top: 1.4rem; }
.reward .ico { font-size: 3.6rem; }
.reward:not(.locked) { outline: 3px solid var(--star); outline-offset: -3px; }
.reward:not(.locked) .need { box-shadow: 0 4px 0 color-mix(in srgb, var(--star) 60%, #7a5200); }
.chal-ico { font-size: 2.6rem; }
.steps { display: flex; gap: .3rem; flex-wrap: wrap; }
.step { width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 1.15rem; box-shadow: inset 0 2px 0 rgba(0, 0, 0, .07); }
.step.on { background: color-mix(in srgb, var(--star) 30%, var(--surface)); box-shadow: 0 0 0 2px var(--star); }
.steps.failed .step { background: var(--bad-bg); }
.badge { background: var(--surface-2); box-shadow: 0 4px 0 var(--edge); }
.badge .medal { font-size: 2.4rem; }
.big-badge .emo { width: 4.4rem; height: 4.4rem; }
.more-tile .ico { font-size: 2.8rem; }
.more-tile:active { transform: translateY(3px); }
.welcome .stars { font-size: 3.2rem; gap: .8rem; }
.empty .big { font-size: 4rem; }
.tile > span:first-child { font-size: 2rem !important; }

/* =====================================================================
   Capa 3D «de juguete»: volumen con brillo arriba, sombra interior abajo y canto grueso
   ===================================================================== */
:root {
  --hi: rgba(255, 255, 255, .95); --lo: rgba(22, 48, 79, .07); --base: #C6D5E5; --drop: rgba(22, 48, 79, .16);
  --title-edge: #FFFFFF; --num-edge: #C9D8E8; --road: #EBD7AE; --road-edge: #C9A874; --deco-b: 1;
  --cloud-lo: #DCE9F5; --sun-hi: #FFF7C9; --sun-lo: #F4AE00; --lift: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --hi: rgba(255, 255, 255, .10); --lo: rgba(0, 0, 0, .28); --base: #08102A; --drop: rgba(0, 0, 0, .45);
    --title-edge: #0A1330; --num-edge: #0A1330; --road: #3A4A7A; --road-edge: #222E55; --deco-b: .55;
    --cloud-lo: rgba(120, 140, 200, .12); --sun-hi: #FFFFFF; --sun-lo: #C9C4A8; --lift: #2A3B70;
  }
}
:root[data-theme="dark"] {
  --hi: rgba(255, 255, 255, .10); --lo: rgba(0, 0, 0, .28); --base: #08102A; --drop: rgba(0, 0, 0, .45);
  --title-edge: #0A1330; --num-edge: #0A1330; --road: #3A4A7A; --road-edge: #222E55; --deco-b: .55;
  --cloud-lo: rgba(120, 140, 200, .12); --sun-hi: #FFFFFF; --sun-lo: #C9C4A8; --lift: #2A3B70;
}

/* Paisaje con volumen */
.scene .sun { background: radial-gradient(circle at 34% 30%, var(--sun-hi) 0%, var(--sun) 48%, var(--sun-lo) 100%); }
.scene .cloud { background: linear-gradient(180deg, var(--cloud) 40%, var(--cloud-lo) 100%); filter: drop-shadow(0 6px 6px rgba(22, 48, 79, .10)); }
.scene .h1 { background: radial-gradient(ellipse at 45% 0%, var(--hill-3) 0%, var(--hill-2) 45%, color-mix(in srgb, var(--hill-2) 70%, #000) 100%); }
.scene .h2 { background: radial-gradient(ellipse at 40% 5%, color-mix(in srgb, var(--hill-1) 70%, #fff) 0%, var(--hill-1) 40%, color-mix(in srgb, var(--hill-1) 75%, #000) 100%); }
.scene .h3 { background: radial-gradient(ellipse at 60% 5%, color-mix(in srgb, var(--hill-3) 75%, #fff) 0%, var(--hill-3) 45%, color-mix(in srgb, var(--hill-3) 75%, #000) 100%); }
.scene .deco { position: absolute; height: auto; filter: brightness(var(--deco-b)) drop-shadow(0 8px 6px rgba(0, 0, 0, .22)); }
.scene .d-mount { width: 9rem; right: 16vw; bottom: 14vh; }
.scene .d-castle { width: 5.8rem; right: 4vw; bottom: 11vh; }
